name: Nightly deploy
on:
  push:
    tags:
      - "r*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle assets
        run: yarn install && yarn run bundle
        env:
          NODE_ENV: staging
      - name: Ship artifact
        uses: other-org/deploy-action@v3.0.2
        with:
          registry: https://registry.corp.example
          token: ${{ secrets.DEPLOY_KEY }}
