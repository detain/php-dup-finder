name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # once-S11 (once-014): the `audit` job runs as a green leg on every
  # push/PR (below) AND on a separate weekly cron so a newly-published
  # advisory is caught even on a quiet repo. The scheduled run is the
  # "weekly composer audit" the finding asked for; the push/PR leg is the
  # standing floor that fails the build on a known-advisory dependency.
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        os: [ubuntu-latest]
        include:
          - php: '8.3'
            os: ubuntu-latest
            primary: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # once-S93 (once-116): inotify joined on purpose.
          # tests/Unit/Watch/FileWatcherTest pins that startInotify()/
          # stopInotify() leave no file-descriptor litter behind, but the
          # arm can only RUN where ext-inotify loads — without it the test
          # states its precondition and skips, which is legal on odd boxes
          # yet would silently un-serve CI. Loading the extension here
          # turns that fd-leak fence into a standing CI fact instead of a
          # permanent skip.
          extensions: hash, mbstring, gmp, inotify
          coverage: ${{ matrix.primary && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Validate composer.json
        # once-S11 (php-dup-finder-once-015) pins the 16 direct SugarCraft
        # deps to recorded commit SHAs (`dev-master#<sha>`) so a lock-free
        # `composer install` (composer.lock is gitignored/never published)
        # resolves reproducibly instead of tracking the drifting upstream
        # master HEAD. That pin style is schema-valid but makes
        # `composer validate --strict` emit one intentional
        # "pointing to a commit-ref" warning per dep, which --strict alone
        # would treat as a build failure. Keep strictness for EVERY other
        # problem: run --strict, then fail only when a reported validation
        # line is not one of the expected commit-ref pins. Do not widen this
        # exemption — a real manifest error must still break the build.
        run: |
          set +e
          out="$(composer validate --strict 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          offenders="$(printf '%s\n' "$out" | grep -E '^[[:space:]]*- ' | grep -v 'pointing to a commit-ref')"
          # once-S11 fix-round-1 (MEDIUM-2): the old guard was fail-open for
          # the worst manifest states — composer renders a JSON-parse failure
          # and a missing-file error OUTSIDE the `- ` bullet format, so rc!=0
          # with zero offenders used to slip through. Fail unless the strict
          # error is FULLY explained by commit-ref bullets, which is only true
          # when composer still declared the file valid (rc!=0 + no offenders +
          # "composer.json is valid" present). Parse/missing failures never
          # print that line, so they break the build as promised above.
          if [ "$rc" -ne 0 ] && { [ -n "$offenders" ] || ! printf '%s\n' "$out" | grep -q 'composer.json is valid'; }; then
            echo "::error::composer validate --strict reported non-commit-ref problems"
            printf '%s\n' "$offenders"
            exit 1
          fi
          exit 0

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run test suite
        if: ${{ ! matrix.primary }}
        # --display-deprecations: the 8.4 legs reported 2 deprecations with
        # only position markers ('DD' ~#744/745); naming them needs the text.
        # once-S93 (once-116): @group network is excluded from every bare
        # suite leg — those arms fetch live external endpoints, and the
        # old shape let a blocked-egress box PASS them vacuously (assertNull
        # is also the shape of 'could not connect'). They run ONCE, loudly,
        # in the dedicated Network-group leg below, which preflights the
        # endpoints and fails-not-passes when unreachable.
        run: vendor/bin/phpunit --display-deprecations --exclude-group network

      - name: Run test suite with coverage
        if: ${{ matrix.primary }}
        run: vendor/bin/phpunit --display-deprecations --exclude-group network --coverage-clover coverage.xml --coverage-text

      - name: Golden suite floor (once-S93 — skips fail)
        # The finding: GoldenTest's UPDATE_SNAPSHOTS branch marked itself
        # 'skipped' and stayed silent, and nothing in CI ever looked at
        # skip state at all. The regen now verifies its own write and
        # refuses a vacuous empty rewrite (see tests/Golden/GoldenTest.php);
        # this leg closes the loop CI-side — on the runner the Golden
        # suite has ZERO legitimate skips, so any skip (including an
        # UPDATE_SNAPSHOTS regen that leaked into a push) is a hard red
        # with the reason printed. The env var is deliberately not set
        # here; a regen can only ever come from an interactive run.
        run: vendor/bin/phpunit --testsuite Golden --fail-on-skipped --display-skipped

      - name: Network group (once-S93 — fail not pass)
        if: ${{ matrix.primary }}
        # External egress is the precondition of these arms; without a
        # gate the arms 'pass' on a blocked runner by returning null
        # (once-116: 'fails-not-passes when unreachable'). The preflight
        # pins each endpoint's HTTP answer first and names the outage as
        # the cause; only then does the group run, under --fail-on-skipped
        # so a future skip-launder cannot hide behind it either.
        run: |
          set -euo pipefail
          probe() {
            local want url code
            want="$1"; url="$2"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
            if [ "$code" != "$want" ]; then
              echo "::error::once-S93 network preflight: $url answered HTTP '$code', expected '$want' — the external endpoint is unreachable/wrong, and the @group network arms would pass vacuously. Failing the leg loudly (fail-not-pass)."
              exit 1
            fi
            echo "network preflight OK: $url -> $code"
          }
          probe 500 https://httpbin.org/status/500
          probe 200 https://httpbin.org/status/200
          vendor/bin/phpunit --group network --fail-on-skipped --display-skipped

      - name: Smoke-test CLI on fixtures (accounting contract)
        # Genuinely strict (0.4): exit code alone was false confidence —
        # the old step passed even if the pipeline silently dropped files.
        # Pins now: schema major stays 1, every file-accounting key exists,
        # the fixture corpus parses clean, the 91-file scan is fully
        # accounted for by the balance law, and the planted clones are
        # still found. A cold throwaway cache_dir keeps the run hermetic
        # (--no-cache never suppressed the on-disk AST cache).
        env:
          PHPDUP_CFG: ${{ runner.temp }}/phpdup-smoke-cfg.json
          PHPDUP_OUT: ${{ runner.temp }}/phpdup-smoke-report.json
        run: |
          printf '{"cache_dir":"%s"}' "${RUNNER_TEMP}/phpdup-smoke-cache" > "$PHPDUP_CFG"
          bin/phpdup analyze tests/Fixtures --min-impact 5 --limit 3 -c "$PHPDUP_CFG" --json "$PHPDUP_OUT"
          php -r '
            $r = json_decode((string) file_get_contents(getenv("PHPDUP_OUT")), true);
            if (!is_array($r)) { fwrite(STDERR, "smoke: report missing/unparseable\n"); exit(1); }
            $s = $r["summary"] ?? [];
            if (substr((string) ($r["schema_version"] ?? ""), 0, 2) !== "1.") { fwrite(STDERR, "smoke: schema major drifted: " . var_export($r["schema_version"] ?? null, true) . "\n"); exit(1); }
            foreach (["files","files_scanned","files_reused","files_processed","files_without_blocks","parse_errors","clusters","duplicated_lines"] as $k) {
              if (!array_key_exists($k, $s)) { fwrite(STDERR, "smoke: summary.$k missing\n"); exit(1); }
            }
            if ($s["parse_errors"] !== 0) { fwrite(STDERR, "smoke: fixtures corpus must parse clean (parse_errors={$s["parse_errors"]})\n"); exit(1); }
            if ($s["files_scanned"] !== 91) { fwrite(STDERR, "smoke: expected 91 scanned fixture files, got {$s["files_scanned"]}\n"); exit(1); }
            $b = $s["files_reused"] + $s["files_processed"] + $s["files_without_blocks"] + $s["parse_errors"];
            if ($b !== $s["files_scanned"]) { fwrite(STDERR, "smoke: balance law violated: scanned={$s["files_scanned"]} buckets_sum={$b}\n"); exit(1); }
            if ($s["clusters"] < 1) { fwrite(STDERR, "smoke: planted fixture clones disappeared (clusters=0)\n"); exit(1); }
            if ($s["duplicated_lines"] <= 0) { fwrite(STDERR, "smoke: no duplicated lines reported despite planted clones\n"); exit(1); }
            echo "smoke ok: {$s["files_scanned"]} files accounted ({$s["files_reused"]} reused / {$s["files_processed"]} processed / {$s["files_without_blocks"]} no-blocks), {$s["clusters"]} clusters\n";
          '

      - name: Upload coverage to Codecov
        if: ${{ matrix.primary }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload coverage artifact
        if: ${{ matrix.primary }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.php }}
          path: coverage.xml

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: hash, mbstring, gmp
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint PHP files
        # 2026-11-21: tests/Fixtures is scanner corpus, not code — the
        # crash#3 regression pin switch_bare_return.php is parse-fatal by
        # design (exactly one of the 20 corpus files is); the rest is
        # fixture data not intended for lint, mirroring the phpstan/psalm
        # src-only scoping precedent.
        run: |
          find src tests -name "*.php" -not -path "tests/Fixtures/*" -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Psalm
        run: vendor/bin/psalm --no-progress --no-cache

  # once-S11 (php-dup-finder-once-014) — the dependency-audit floor.
  # Runs the production dependency graph (the graph actually shipped inside
  # the phar/zipball built by release.yml) through `composer audit` and
  # fails closed on any published advisory. It is wired to fire on every
  # push/PR (green leg) AND on the weekly cron declared in `on:`. The dev
  # toolchain (phpstan/psalm/phpunit) is audited transitively by the same
  # command but is intentionally out of this job's fail-closed scope —
  # --no-dev keeps the gate aligned to what a user installs.
  #
  # It also installs from a lock-free checkout, so it doubles as the
  # standing proof that once-015's dev-master#<sha> pins resolve cleanly:
  # a dangling/unfetchable upstream ref breaks this leg before it can
  # reach a release.
  audit:
    name: Dependency audit (composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: hash, mbstring, gmp
          coverage: none
          tools: composer:v2

      - name: Install production dependencies (lock-free resolve)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: composer audit
        # No blanket ignore. A suppressed advisory must live in
        # composer.json `config.audit.ignore` (empty today) with a dated
        # justification, never a per-run --ignore flag.
        # once-S11 fix-round-1 (HIGH-1): dropped `--format=github` — composer
        # 2.x audit only accepts table|plain|json|summary, so the shipped flag
        # errored rc=1 on every run. Default `table` output is fine for this
        # pass/fail gate; the fail-hard posture (exit non-zero on any advisory)
        # is unchanged.
        run: composer audit --no-dev

  # once-S56 (php-dup-finder-once-062) — CI artifact gate: the BUILT phar runs.
  # Before this job nothing in CI ever executed the shipped artifact (ci.yml
  # carried zero phar build/exec steps — the "phantom pass" the finding
  # names: a phar that cannot run would still ship green). This job builds the
  # phar the way release.yml does, then — with phar.readonly at its DEFAULT
  # (no -d flag on any exec leg; reading a phar needs no override) — runs
  # `php phpdup.phar --version`, analyzes /tmp copies of the three golden
  # corpora through the artifact and JSON-compares the reports against
  # tests/Golden/*.json READ-ONLY (never UPDATE_SNAPSHOTS: the snapshots are
  # the reference, the artifact is the suspect), and pins the once-S31-r1 F-2
  # cure (shipped at 79e0ea3, Command-boundary absolutize) in its shipped
  # form: a relative scan root through the built phar must analyze files > 0
  # AND actually write its report — pre-cure that cell was `rc=0 ·
  # 1 path(s) → 0 files · no report`, invisible to an rc-only check, which is
  # why the assertion reads the JSON summary, not the exit code.
  # Measured CI budget (once-S28-r1 reviewer + this lane, lean --no-dev
  # vendor): first phar build ~2m41s, legs below are seconds — well inside
  # the timeout-minutes ceiling.
  artifact-smoke:
    name: Built-artifact phar smoke (phpdup.phar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # `phar` stated explicitly like release.yml's builder job; the exec
          # legs below never pass -d phar.readonly=0 — only WRITING a phar
          # needs that override.
          extensions: phar, hash, mbstring, gmp
          coverage: none
          tools: composer:v2

      - name: Install production dependencies (release/lean shape)
        # The builder header mandates this vendor shape: its ~18 MB size note
        # is a --no-dev --optimize-autoloader build. A dev vendor would smoke
        # an artifact nobody ships.
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Build the phar (the only step that writes one)
        # Same invocation release.yml uses. A missing/stub-sized artifact
        # fails HERE — the old phantom pass was possible precisely because no
        # leg ever looked for the file.
        run: |
          php -d phar.readonly=0 build-phar.php
          test -f phpdup.phar
          php -r 'exit((filesize("phpdup.phar") ?: 0) > 1000000 ? 0 : 1);' || { echo "::error::phpdup.phar missing or implausibly small — build produced no shippable artifact"; exit 1; }

      - name: Exec the artifact with phar.readonly at its default
        # php-form (the plan's letter) plus the chmod'ed direct-exec form the
        # README's PATH-install posture ships. --version output is pinned
        # against src/Util/Version.php so stub, artifact and reports cannot
        # disagree on identity (once-S30 chain).
        run: |
          php phpdup.phar --version
          ./phpdup.phar --version
          test "$(php phpdup.phar --version)" = "phpdup $(php -r 'require "src/Util/Version.php"; echo Phpdup\Util\Version::STRING;')"

      - name: Golden corpora through the artifact — JSON-compare vs tests/Golden (read-only)
        # /tmp fixture copies per the finding's release-side posture (the
        # drop-anywhere artifact must analyze a tree OUTSIDE the checkout).
        # Full-payload compare after the same path-normalization
        # tests/Golden/GoldenTest.php applies (drop config.paths; rebase
        # member/template/evidence paths onto the golden's repo-relative
        # form) — the artifact reproducing a golden byte-for-byte in that
        # normalised view is the strongest statement the snapshots support
        # without re-running UPDATE_SNAPSHOTS anywhere.
        env:
          PHPDUP_SMOKE: ${{ runner.temp }}/phpdup-artifact-smoke
        run: |
          set -euo pipefail
          rm -rf "$PHPDUP_SMOKE"; mkdir -p "$PHPDUP_SMOKE"
          cp -r tests/Fixtures/notify "$PHPDUP_SMOKE/notify"
          cp -r tests/Fixtures/sql "$PHPDUP_SMOKE/sql"
          cp -r tests/Fixtures/optional "$PHPDUP_SMOKE/optional"
          printf '{"cache_dir":"%s"}' "$PHPDUP_SMOKE/.cache" > "$PHPDUP_SMOKE/cfg.json"
          php phpdup.phar analyze "$PHPDUP_SMOKE/notify" --exact-only --no-cache --no-lazy-ast -c "$PHPDUP_SMOKE/cfg.json" --json "$PHPDUP_SMOKE/notify.json"
          php phpdup.phar analyze "$PHPDUP_SMOKE/sql" --exact-only --no-cache --no-lazy-ast -c "$PHPDUP_SMOKE/cfg.json" --json "$PHPDUP_SMOKE/sql.json"
          php phpdup.phar analyze "$PHPDUP_SMOKE/optional" --no-cache --no-lazy-ast -c "$PHPDUP_SMOKE/cfg.json" --json "$PHPDUP_SMOKE/optional.json"
          cat > "$PHPDUP_SMOKE/compare.php" <<'PHP'
          <?php
          declare(strict_types=1);
          // argv: <run.json> <golden.json> <temp-corpus-base> <golden-path-prefix>
          [$run, $gold, $base, $pre] = [$argv[1], $argv[2], $argv[3], $argv[4]];
          $r = json_decode((string)file_get_contents($run), true);
          $g = json_decode((string)file_get_contents($gold), true);
          if (!is_array($r) || !is_array($g)) { fwrite(STDERR, "artifact-smoke: unparseable JSON\n"); exit(1); }
          $base = rtrim($base, '/') . '/';
          unset($r['config']['paths']);
          foreach ($r['clusters'] as &$c) {
              foreach ($c['members'] as &$m) {
                  if (isset($m['file']) && is_string($m['file']) && str_starts_with($m['file'], $base)) {
                      $m['file'] = $pre . substr($m['file'], strlen($base));
                  }
              }
              unset($m);
              foreach (['template', 'evidence_diff'] as $k) {
                  if (isset($c[$k]['file']) && is_string($c[$k]['file']) && str_starts_with($c[$k]['file'], $base)) {
                      $c[$k]['file'] = $pre . substr($c[$k]['file'], strlen($base));
                  }
                  if (isset($c[$k]['diff']) && is_string($c[$k]['diff'])) {
                      $c[$k]['diff'] = str_replace($base, $pre, $c[$k]['diff']);
                  }
              }
              unset($c);
          }
          $diffs = [];
          $cmp = function ($a, $b, string $path) use (&$cmp, &$diffs): void {
              if (is_array($a) && is_array($b)) {
                  foreach (array_unique(array_merge(array_keys($a), array_keys($b))) as $k) {
                      $cmp($a[$k] ?? ['__missing__' => true], $b[$k] ?? ['__missing__' => true], $path . '.' . $k);
                  }
                  return;
              }
              if ($a !== $b) { $diffs[] = $path; }
          };
          $cmp($r, $g, '');
          if ($diffs !== []) {
              fwrite(STDERR, 'artifact-smoke: ' . basename($gold) . ' drifted at ' . count($diffs) . " path(s):\n  " . implode("\n  ", array_slice($diffs, 0, 20)) . "\n");
              exit(1);
          }
          $s = $r['summary'];
          echo 'artifact-smoke ok: ' . basename($gold) . " reproduced exactly ({$s['files_scanned']} files, {$s['clusters']} clusters, {$s['duplicated_lines']} dup lines)\n";
          PHP
          php "$PHPDUP_SMOKE/compare.php" "$PHPDUP_SMOKE/notify.json" tests/Golden/notify-exact.json "$PHPDUP_SMOKE/notify" "tests/Fixtures/notify/"
          php "$PHPDUP_SMOKE/compare.php" "$PHPDUP_SMOKE/sql.json" tests/Golden/sql-exact.json "$PHPDUP_SMOKE/sql" "tests/Fixtures/sql/"
          php "$PHPDUP_SMOKE/compare.php" "$PHPDUP_SMOKE/optional.json" tests/Golden/optional-near-dups.json "$PHPDUP_SMOKE/optional" "tests/Fixtures/optional/"

      - name: Relative-root smoke — the once-S31 F-2 shipped-form pin (files_analyzed > 0)
        # The form README §install-as-PATH-tool documents (`phpdup analyze
        # <relative>/`), run from a scratch cwd through the BUILT artifact.
        # Positive half: files_scanned > 0 and the report file exists.
        # Discriminator half (what makes this pin non-vacuous): with the
        # parent's Command.php (pre-79e0ea3) this same cell on a real rebuild
        # returns rc=0, "1 path(s) → 0 files" and NEVER writes the report —
        # proven twice live (once-S31-r1, shell-S28-r1, and this lane's own
        # dual rebuild). An rc-only check cannot see that failure; this one
        # reads the JSON summary the way a user's results would.
        env:
          PHPDUP_PROBE: ${{ runner.temp }}/phpdup-artifact-probe
        run: |
          set -euo pipefail
          rm -rf "$PHPDUP_PROBE"; mkdir -p "$PHPDUP_PROBE/dup/src"
          cat > "$PHPDUP_PROBE/dup/src/A.php" <<'PHP'
          <?php
          class A {
              public function render(string $label, array $items): string {
                  $out = $label . PHP_EOL;
                  foreach ($items as $key => $value) {
                      if ($value === null) {
                          $out .= $key . ": empty\n";
                          continue;
                      }
                      $out .= $key . ': ' . htmlspecialchars((string) $value, ENT_QUOTES) . "\n";
                  }
                  return $out;
              }
          }
          PHP
          cat > "$PHPDUP_PROBE/dup/src/B.php" <<'PHP'
          <?php
          class B {
              public function display(string $title, array $rows): string {
                  $text = $title . PHP_EOL;
                  foreach ($rows as $name => $cell) {
                      if ($cell === null) {
                          $text .= $name . ": empty\n";
                          continue;
                      }
                      $text .= $name . ': ' . htmlspecialchars((string) $cell, ENT_QUOTES) . "\n";
                  }
                  return $text;
              }
          }
          PHP
          printf '{"cache_dir":"%s"}' "$PHPDUP_PROBE/.cache" > "$PHPDUP_PROBE/cfg.json"
          cd "$PHPDUP_PROBE"
          "$GITHUB_WORKSPACE/phpdup.phar" analyze dup --exact-only --no-cache --no-lazy-ast \
            -c "$PHPDUP_PROBE/cfg.json" --json "$PHPDUP_PROBE/rel.json"
          test -f "$PHPDUP_PROBE/rel.json" || { echo "::error::relative-root scan wrote no report — the F-2 silent-zero shipped form is back"; exit 1; }
          php -r '
            $s = json_decode((string) file_get_contents(getenv("PHPDUP_PROBE") . "/rel.json"), true)["summary"] ?? [];
            if (($s["files_scanned"] ?? 0) < 1) { fwrite(STDERR, "artifact-smoke: relative-root scan analyzed 0 files (F-2 silent-zero)\n"); exit(1); }
            if (($s["clusters"] ?? 0) < 1) { fwrite(STDERR, "artifact-smoke: planted relative-root dup pair disappeared (clusters=0)\n"); exit(1); }
            echo "artifact-smoke ok: relative-root scan through the built phar analyzed {$s["files_scanned"]} files, {$s["clusters"]} clusters\n";
          '
  docs-links:
    name: README anchor resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve every local link in README.md against the docs tree
        # once-S13 (php-dup-finder-once-011, HIGH): the Phase-12 DOC-1 cut
        # (47cd3c4) moved the long README guide into docs/ and left the
        # Table of contents pointing at the removed headings — 18 of 36
        # local links dead at the wave's start, #examples the sole survivor.
        # The index is now rebuilt against the real docs tree; this leg is
        # the standing guard: every [text](target) in README.md must
        # resolve — the file exists, and any #fragment matches a
        # GitHub-style slug of a real heading in that file (headings inside
        # fenced code blocks do not count). Fail-loud: each dead link is
        # printed with file:line, then the step exits 1. Slug rule:
        # lowercase, keep [a-z0-9_ -], spaces to hyphens, duplicates get
        # GitHub's -1/-2/… suffix.
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/anchorcheck.awk" <<'AWK'
          function slugify(h) {
            h = tolower(h)
            gsub(/[^a-z0-9_ -]/, "", h)   # GitHub keeps letters, digits, '_', '-', space (→ '-')
            gsub(/ /, "-", h)
            return h
          }
          function load(file,   line, fence, s, n) {
            if (file in loaded) return
            loaded[file] = 1
            fence = 0
            while ((getline line < file) > 0) {
              if (line ~ /^[ \t]*(```|~~~)/) { fence = !fence; continue }
              if (fence) continue
              if (line !~ /^#{1,6}[ \t]+/) continue
              sub(/^#{1,6}[ \t]+/, "", line)
              sub(/[ \t]+#+[ \t]*$/, "", line)
              s = slugify(line)
              n = ++dcnt[file SUBSEP s]
              if (n > 1) s = s "-" (n - 1)      # GitHub dedup suffix: foo, foo-1, ...
              have[file SUBSEP s] = 1
            }
            close(file)
          }
          BEGIN { dead = 0; total = 0 }
          {
            line = $0
            while (match(line, /\]\([^)]*\)/)) {
              t = substr(line, RSTART + 2, RLENGTH - 3)
              line = substr(line, RSTART + RLENGTH)
              sub(/[ \t].*$/, "", t)                        # drop any "title" portion
              if (t == "") continue                         # [x]() — nothing to resolve
              if (t ~ /^[A-Za-z][A-Za-z0-9+.-]*:/) continue # scheme (http/https/mailto/…)
              total++
              f = t; a = ""
              p = index(f, "#")
              if (p) { a = substr(f, p + 1); f = substr(f, 1, p - 1) }
              if (f == "") f = SCAN
              if ((getline probe < f) < 0) {
                close(f)
                printf "DEAD  %s:%d  %s  (file not found)\n", SCAN, NR, t
                dead++
                continue
              }
              close(f)
              if (a != "") {
                load(f)
                if (!((f SUBSEP a) in have)) {
                  printf "DEAD  %s:%d  %s  (no heading with slug \"%s\")\n", SCAN, NR, t, a
                  dead++
                }
              }
            }
          }
          END {
            printf "README anchor census: %d local links, %d dead\n", total, dead
            exit (dead > 0 ? 1 : 0)
          }
          AWK
          awk -v SCAN=README.md -f "$RUNNER_TEMP/anchorcheck.awk" README.md
