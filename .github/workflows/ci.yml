name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # once-S11 (once-014): the `audit` job runs as a green leg on every
  # push/PR (below) AND on a separate weekly cron so a newly-published
  # advisory is caught even on a quiet repo. The scheduled run is the
  # "weekly composer audit" the finding asked for; the push/PR leg is the
  # standing floor that fails the build on a known-advisory dependency.
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        os: [ubuntu-latest]
        include:
          - php: '8.3'
            os: ubuntu-latest
            primary: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: hash, mbstring, gmp
          coverage: ${{ matrix.primary && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Validate composer.json
        # once-S11 (php-dup-finder-once-015) pins the 16 direct SugarCraft
        # deps to recorded commit SHAs (`dev-master#<sha>`) so a lock-free
        # `composer install` (composer.lock is gitignored/never published)
        # resolves reproducibly instead of tracking the drifting upstream
        # master HEAD. That pin style is schema-valid but makes
        # `composer validate --strict` emit one intentional
        # "pointing to a commit-ref" warning per dep, which --strict alone
        # would treat as a build failure. Keep strictness for EVERY other
        # problem: run --strict, then fail only when a reported validation
        # line is not one of the expected commit-ref pins. Do not widen this
        # exemption — a real manifest error must still break the build.
        run: |
          set +e
          out="$(composer validate --strict 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          offenders="$(printf '%s\n' "$out" | grep -E '^[[:space:]]*- ' | grep -v 'pointing to a commit-ref')"
          if [ "$rc" -ne 0 ] && [ -n "$offenders" ]; then
            echo "::error::composer validate --strict reported non-commit-ref problems"
            printf '%s\n' "$offenders"
            exit 1
          fi
          exit 0

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run test suite
        if: ${{ ! matrix.primary }}
        # --display-deprecations: the 8.4 legs reported 2 deprecations with
        # only position markers ('DD' ~#744/745); naming them needs the text.
        run: vendor/bin/phpunit --display-deprecations

      - name: Run test suite with coverage
        if: ${{ matrix.primary }}
        run: vendor/bin/phpunit --display-deprecations --coverage-clover coverage.xml --coverage-text

      - name: Smoke-test CLI on fixtures (accounting contract)
        # Genuinely strict (0.4): exit code alone was false confidence —
        # the old step passed even if the pipeline silently dropped files.
        # Pins now: schema major stays 1, every file-accounting key exists,
        # the fixture corpus parses clean, the 20-file scan is fully
        # accounted for by the balance law, and the planted clones are
        # still found. A cold throwaway cache_dir keeps the run hermetic
        # (--no-cache never suppressed the on-disk AST cache).
        env:
          PHPDUP_CFG: ${{ runner.temp }}/phpdup-smoke-cfg.json
          PHPDUP_OUT: ${{ runner.temp }}/phpdup-smoke-report.json
        run: |
          printf '{"cache_dir":"%s"}' "${RUNNER_TEMP}/phpdup-smoke-cache" > "$PHPDUP_CFG"
          bin/phpdup analyze tests/Fixtures --min-impact 5 --limit 3 -c "$PHPDUP_CFG" --json "$PHPDUP_OUT"
          php -r '
            $r = json_decode((string) file_get_contents(getenv("PHPDUP_OUT")), true);
            if (!is_array($r)) { fwrite(STDERR, "smoke: report missing/unparseable\n"); exit(1); }
            $s = $r["summary"] ?? [];
            if (substr((string) ($r["schema_version"] ?? ""), 0, 2) !== "1.") { fwrite(STDERR, "smoke: schema major drifted: " . var_export($r["schema_version"] ?? null, true) . "\n"); exit(1); }
            foreach (["files","files_scanned","files_reused","files_processed","files_without_blocks","parse_errors","clusters","duplicated_lines"] as $k) {
              if (!array_key_exists($k, $s)) { fwrite(STDERR, "smoke: summary.$k missing\n"); exit(1); }
            }
            if ($s["parse_errors"] !== 0) { fwrite(STDERR, "smoke: fixtures corpus must parse clean (parse_errors={$s["parse_errors"]})\n"); exit(1); }
            if ($s["files_scanned"] !== 20) { fwrite(STDERR, "smoke: expected 20 scanned fixture files, got {$s["files_scanned"]}\n"); exit(1); }
            $b = $s["files_reused"] + $s["files_processed"] + $s["files_without_blocks"] + $s["parse_errors"];
            if ($b !== $s["files_scanned"]) { fwrite(STDERR, "smoke: balance law violated: scanned={$s["files_scanned"]} buckets_sum={$b}\n"); exit(1); }
            if ($s["clusters"] < 1) { fwrite(STDERR, "smoke: planted fixture clones disappeared (clusters=0)\n"); exit(1); }
            if ($s["duplicated_lines"] <= 0) { fwrite(STDERR, "smoke: no duplicated lines reported despite planted clones\n"); exit(1); }
            echo "smoke ok: {$s["files_scanned"]} files accounted ({$s["files_reused"]} reused / {$s["files_processed"]} processed / {$s["files_without_blocks"]} no-blocks), {$s["clusters"]} clusters\n";
          '

      - name: Upload coverage to Codecov
        if: ${{ matrix.primary }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload coverage artifact
        if: ${{ matrix.primary }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.php }}
          path: coverage.xml

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: hash, mbstring, gmp
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint PHP files
        # 2026-11-21: tests/Fixtures is scanner corpus, not code — the
        # crash#3 regression pin switch_bare_return.php is parse-fatal by
        # design (exactly one of the 20 corpus files is); the rest is
        # fixture data not intended for lint, mirroring the phpstan/psalm
        # src-only scoping precedent.
        run: |
          find src tests -name "*.php" -not -path "tests/Fixtures/*" -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Psalm
        run: vendor/bin/psalm --no-progress --no-cache

  # once-S11 (php-dup-finder-once-014) — the dependency-audit floor.
  # Runs the production dependency graph (the graph actually shipped inside
  # the phar/zipball built by release.yml) through `composer audit` and
  # fails closed on any published advisory. It is wired to fire on every
  # push/PR (green leg) AND on the weekly cron declared in `on:`. The dev
  # toolchain (phpstan/psalm/phpunit) is audited transitively by the same
  # command but is intentionally out of this job's fail-closed scope —
  # --no-dev keeps the gate aligned to what a user installs.
  #
  # It also installs from a lock-free checkout, so it doubles as the
  # standing proof that once-015's dev-master#<sha> pins resolve cleanly:
  # a dangling/unfetchable upstream ref breaks this leg before it can
  # reach a release.
  audit:
    name: Dependency audit (composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: hash, mbstring, gmp
          coverage: none
          tools: composer:v2

      - name: Install production dependencies (lock-free resolve)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: composer audit
        # No blanket ignore. A suppressed advisory must live in
        # composer.json `config.audit.ignore` (empty today) with a dated
        # justification, never a per-run --ignore flag.
        run: composer audit --format=github --no-dev
