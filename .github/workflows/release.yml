name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # once-S05 (php-dup-finder-once-005) — fail-closed signing rebuild:
  #   * the HMAC secret env is declared on the step that SIGNS (and only
  #     there — it used to sit on the upload step while the sign step ran
  #     without it, so every public release was HMAC'd with an empty key);
  #   * the sign step refuses to run with an unset/empty secret;
  #   * the signature covers a tag-bound release MANIFEST whose bytes also
  #     pin the artifact's sha256, so self:update no longer trusts a
  #     checksum from the same response as the artifact;
  #   * signing uses the RAW key string — UpdateCommand::VERIFICATION_KEY
  #     is compared in the same raw form (the old base64_decode() here vs
  #     raw constant there could never agree);
  #   * the publish job only runs after the round-trip verify gate below.
  build-and-sign:
    name: Build & Sign PHAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: phar

      - name: Install dependencies
        run: composer install --no-interaction --no-dev

      - name: Build PHAR
        run: php -d phar.readonly=0 build-phar.php
        env:
          BOX_PHAR: 1

      - name: Record reproducible build metadata (once-S11 / once-015)
        # Emits two files that make the release auditable + reproducible:
        #   * phpdup.build.json      — the resolved sugarcraft dist/source
        #     references (the exact upstream commits frozen by the
        #     dev-master#<sha> pins), the composer content-hash, the PHP
        #     runtime, and the build instant. This is where date()/buildTime
        #     is recorded: in a METADATA FILE, so the timestamp never has to
        #     be baked into the artifact bytes to make a release
        #     attributable. (build-phar.php still stamps {{BUILT}} into the
        #     stub today — that in-artifact stamp is scheduled to move to
        #     this metadata file in once-S31, which owns build-phar.php.)
        #   * phpdup.releasenotes.md — a human summary that the publish job
        #     attaches as the GitHub release body, so the recorded hashes are
        #     visible in the release itself (the once-015 "publish dist
        #     hashes in release notes" compromise, chosen over committing the
        #     gitignored composer.lock).
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          php -r '
            $lock = json_decode((string) @file_get_contents("composer.lock"), true);
            $deps = [];
            if (is_array($lock)) {
              foreach (array_merge($lock["packages"] ?? [], $lock["packages-dev"] ?? []) as $p) {
                $name = (string) ($p["name"] ?? "");
                if (str_starts_with($name, "sugarcraft/")) {
                  $ref = $p["dist"]["reference"] ?? ($p["source"]["reference"] ?? null);
                  $deps[$name] = ["version" => $p["version"] ?? null, "reference" => $ref];
                }
              }
            }
            if ($deps === []) {
                fwrite(STDERR, "release.yml: no sugarcraft packages found in composer.lock — refusing to publish an unattributable build\n");
                exit(1);
            }
            $built = (new DateTimeImmutable("now", new DateTimeZone("UTC")))->format(DateTimeInterface::ATOM);
            $tag   = (string) getenv("RELEASE_TAG");
            if ($tag === "") { fwrite(STDERR, "release.yml: empty tag in build metadata\n"); exit(1); }
            $meta = [
              "schema"              => 1,
              "tag"                 => $tag,
              "built_utc"           => $built,
              "composer_content_hash" => $lock["content-hash"] ?? null,
              "php"                 => PHP_VERSION,
              "sugarcraft_pins"     => $deps,
            ];
            file_put_contents("phpdup.build.json", json_encode($meta, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
            $lines = [];
            $lines[] = "## Reproducible build (once-S11)";
            $lines[] = "";
            $lines[] = "- Tag: `$tag`";
            $lines[] = "- Build time (UTC, recorded in `phpdup.build.json`, not in artifact bytes): `$built`";
            $lines[] = "- Composer content-hash: `" . ($lock["content-hash"] ?? "n/a") . "`";
            $lines[] = "- PHP runtime: `" . PHP_VERSION . "`";
            $lines[] = "";
            $lines[] = "SugarCraft dependencies are frozen to recorded commits (`dev-master#<sha>`); the effective resolved references are:";
            $lines[] = "";
            $lines[] = "| package | resolved ref |";
            $lines[] = "| --- | --- |";
            ksort($deps);
            foreach ($deps as $n => $d) {
              $lines[] = "| $n | `" . ($d["reference"] ?? "?") . "` |";
            }
            file_put_contents("phpdup.releasenotes.md", implode("\n", $lines) . "\n");
            echo "Wrote phpdup.build.json (" . count($deps) . " sugarcraft refs) + phpdup.releasenotes.md\n";
          '

      - name: Compute SHA-256 checksum
        # Informational sidecar for manual installs (sha256sum). NOT used
        # by self:update verification — the artifact hash the client honors
        # is the one pinned inside the SIGNED manifest. Once-S12
        # (php-dup-finder-once-010): the file carries the GNU coreutils
        # checksum format "<hash>  phpdup.phar" (TWO spaces — text mode)
        # so `sha256sum --check phpdup.phar.sha256` from the README works
        # verbatim; the old bare-hash line made coreutils report "no
        # properly formatted checksum lines found".
        run: php -r "printf('%s  phpdup.phar%s', hash_file('sha256', 'phpdup.phar'), PHP_EOL);" > phpdup.phar.sha256

      - name: Build release manifest
        env:
          MANIFEST_TAG: ${{ github.ref_name }}
        run: |
          php -r '
            $line = trim((string) file_get_contents("phpdup.phar.sha256"));
            $tag = (string) getenv("MANIFEST_TAG");
            // The manifest consumes the SAME bytes the manual installer
            // verifies: an exact coreutils-format line, hash captured from
            // it. A sidecar that drifted out of that format aborts the
            // release instead of pinning garbage (fail loud, once-S12).
            if (!preg_match("/^([0-9a-f]{64})  phpdup\\.phar$/", $line, $m) || $tag === "") {
                fwrite(STDERR, "release.yml: malformed checksum sidecar or empty tag\n");
                exit(1);
            }
            $sha = $m[1];
            echo json_encode(
                ["schema" => 1, "tag" => $tag, "file" => "phpdup.phar", "sha256" => $sha],
                JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES
            ), "\n";
          ' > phpdup.release.json

      - name: Sign release manifest (HMAC-SHA256)
        env:
          HMAC_SECRET_KEY: ${{ secrets.HMAC_SECRET_KEY }}
        run: |
          if [ -z "${HMAC_SECRET_KEY:-}" ]; then
            echo "::error::HMAC_SECRET_KEY is not configured for this repository."
            echo "::error::Refusing to publish an empty-key signature (php-dup-finder-once-005)."
            exit 1
          fi
          # RAW key string on both sides — no base64_decode() here ever
          # again; UpdateCommand verifies against the same raw form.
          php -r "echo hash_hmac_file('sha256', 'phpdup.release.json', (string) getenv('HMAC_SECRET_KEY'));" > phpdup.release.json.sig

      - name: Stage workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            phpdup.phar
            phpdup.phar.sha256
            phpdup.release.json
            phpdup.release.json.sig
            phpdup.build.json
            phpdup.releasenotes.md
          if-no-files-found: error

  # Acceptance gate for php-dup-finder-once-005: the CI round-trip.
  # Sign -> verify through the REAL UpdateCommand code path (offline
  # --verify-* mode, available from a source tree): a good artifact must
  # verify (exit 0), a tampered one must refuse (exit 1), and the shipped
  # placeholder verification key must REFUSE (exit 1) instead of passing.
  # `publish` needs this job, so nothing is attached to a release unless
  # all three legs hold.
  roundtrip-verify:
    name: Verify self:update round-trip (sign -> verify -> tamper refusal)
    runs-on: ubuntu-latest
    needs: build-and-sign

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-interaction --no-dev

      - name: Fetch staged release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Round-trip — good artifact verifies (exit 0)
        env:
          PHPDUP_UPDATE_VERIFICATION_KEY: ${{ secrets.HMAC_SECRET_KEY }}
        run: |
          php bin/phpdup self:update \
            --verify-artifact=phpdup.phar \
            --verify-manifest=phpdup.release.json \
            --verify-signature=phpdup.release.json.sig

      - name: Round-trip — tampered artifact refuses (exit 1)
        env:
          PHPDUP_UPDATE_VERIFICATION_KEY: ${{ secrets.HMAC_SECRET_KEY }}
        run: |
          cp phpdup.phar phpdup.tampered.phar
          printf 'TAMPER' >> phpdup.tampered.phar
          if php bin/phpdup self:update \
              --verify-artifact=phpdup.tampered.phar \
              --verify-manifest=phpdup.release.json \
              --verify-signature=phpdup.release.json.sig; then
            echo "::error::tampered artifact passed verification — fail-open regression"
            exit 1
          fi

      - name: Round-trip — placeholder verification key refuses (exit 1)
        run: |
          # No PHPDUP_UPDATE_VERIFICATION_KEY here: the compiled-in constant
          # is still the build placeholder, and verification must REFUSE.
          if php bin/phpdup self:update \
              --verify-artifact=phpdup.phar \
              --verify-manifest=phpdup.release.json \
              --verify-signature=phpdup.release.json.sig; then
            echo "::error::placeholder verification key passed verification — fail-open regression"
            exit 1
          fi

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: roundtrip-verify

    steps:
      - name: Fetch staged release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            phpdup.phar
            phpdup.phar.sha256
            phpdup.release.json
            phpdup.release.json.sig
            phpdup.build.json
            phpdup.releasenotes.md
          # once-S11: attach the recorded-hash release notes as the body so
          # the exact upstream commits behind this build are public on the
          # release page (the publish-dist-hashes compromise over shipping
          # the gitignored composer.lock).
          body_path: phpdup.releasenotes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: HMAC_SECRET_KEY deliberately absent — the upload step
          # never needed it; the old placement (secret on upload, missing
          # on sign) is the bug once-S05 fixed.
