name: 'phpdup'
description: 'Run php-dup-finder against a PHP codebase and surface duplicate-logic findings via CI artifacts (SARIF, JSON, HTML, Checkstyle). The tool is materialized into the runner temp dir before it executes; your repository is only scanned, never mutated.'
author: 'Joe Huss <detain@interserver.net>'

branding:
  icon: 'copy'
  color: 'purple'

inputs:
  paths:
    description: 'Space-separated paths to scan'
    required: false
    default: 'src'
  version:
    description: >-
      php-dup-finder git ref to materialize: a release tag (v1.2.3), a branch
      (master), or a full commit SHA. Default 'master'. Note: the only tag on
      Packagist/GitHub so far, v1.0.0, references renamed upstream packages and
      fails at runtime (see docs/RELEASE.md "Current publication status") — pin
      a SHA at or after the once-S11 dev-master pin migration, or 'master'.
    required: false
    default: 'master'
  tool:
    description: >-
      Materialization mode: 'zip' downloads the pinned ref's source archive and
      runs composer install inside it (works today); 'phar' downloads the
      release's phpdup.phar asset and runs it via `php` (works once a v* tag
      has passed through the release workflow — assets start there, see
      docs/RELEASE.md).
    required: false
    default: 'zip'
  min-impact:
    description: 'Minimum cluster impact to report (passed to --min-impact)'
    required: false
    default: '20'
  config:
    description: 'Optional path to phpdup.json (passed via --config). Use this to specify excludes, normalization mode, etc.'
    required: false
    default: ''
  workers:
    description: 'Worker count (-j). 0 = auto, 1 = serial.'
    required: false
    default: '0'
  exact-only:
    description: 'When true, runs phpdup with --exact-only for faster scans on huge corpora'
    required: false
    default: 'false'
  upload-sarif:
    description: 'Upload the SARIF report to GitHub Code Scanning (default true)'
    required: false
    default: 'true'
  fail-on-impact:
    description: 'Canonical phpdup impact gate (once-S15): exits 3 (the phpdup gate-trip code) when the LARGEST cluster impact in the JSON report is >= N; 0 disables. IDENTICAL formula to the CLI --fail-on-impact N and to docs/CLI.md/docs/CI.md — enforced here in a separate step so older pinned tool refs without the native CLI flag (v1.0.0) still gate.'
    required: false
    default: '0'
  php-version:
    description: 'PHP version to install via shivammathur/setup-php (8.3 or newer: phpdup requires php ^8.3)'
    required: false
    default: '8.3'
  cache-dir:
    description: 'phpdup AST/index cache directory (cached across runs via actions/cache; configure via phpdup.json if non-default)'
    required: false
    default: '.phpdup-cache'

outputs:
  json:
    description: 'Path to the JSON report (relative to the workspace)'
    value: ${{ steps.run.outputs.json }}
  sarif:
    description: 'Path to the SARIF report'
    value: ${{ steps.run.outputs.sarif }}
  html:
    description: 'Path to the HTML report directory'
    value: ${{ steps.run.outputs.html }}
  clusters:
    description: 'Cluster count from the run'
    value: ${{ steps.run.outputs.clusters }}

runs:
  using: 'composite'
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        # hash + mbstring are hard requirements (composer "require"); gmp only
        # accelerates the n-gram popcount fast path (composer "suggest",
        # byte-table fallback otherwise) — mirrored onto the repo's own
        # green ci.yml pins.
        extensions: hash, mbstring, gmp
        coverage: none
        tools: composer:v2

    - name: Get composer cache dir
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache composer dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        # Key the TOOL's dependency set (php-version + mode + pinned ref) —
        # the consumer's composer.json has no bearing on what the tool needs.
        key: phpdup-composer-${{ inputs.php-version }}-${{ inputs.tool }}-${{ inputs.version }}
        restore-keys: |
          phpdup-composer-${{ inputs.php-version }}-${{ inputs.tool }}-

    - name: Cache phpdup AST/index
      uses: actions/cache@v6
      with:
        path: ${{ inputs.cache-dir }}
        key: phpdup-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          phpdup-cache-${{ runner.os }}-

    - name: Materialize phpdup (once-S14 / once-017)
      # The consumer's checkout does NOT contain phpdup; the old flow ran
      # `composer install` there and then executed the non-existent
      # `bin/phpdup`. Instead the tool is fetched, installed and smoke-tested
      # here, into the runner temp dir. Missing/broken tool = hard error.
      id: tool
      shell: bash
      env:
        PHPDUP_MODE: ${{ inputs.tool }}
        PHPDUP_VERSION: ${{ inputs.version }}
        # Composer honors GITHUB_AUTH_TOKEN; the per-run workflow token lifts
        # the anonymous GitHub API ceilings that otherwise flap dependency
        # downloads on shared runner IPs (public repos, read-only).
        GITHUB_AUTH_TOKEN: ${{ github.token }}
      run: |
        # Explicit errexit: a failing composer/unzip/download must abort this
        # step as a hard error on ANY shell, not only because the GitHub
        # runner happens to invoke `bash -e` (once-S14 fix1, r1 report-row R2).
        set -euo pipefail
        TOOL_HOME="${RUNNER_TEMP}/phpdup-tool"
        rm -rf "$TOOL_HOME"
        mkdir -p "$TOOL_HOME"
        case "$PHPDUP_MODE" in
          zip)
            ok=0
            for ref in "refs/tags/${PHPDUP_VERSION}" "refs/heads/${PHPDUP_VERSION}" "${PHPDUP_VERSION}"; do
              if curl -fsSL --retry 3 -o "$TOOL_HOME/tool.zip" "https://codeload.github.com/detain/php-dup-finder/legacy.zip/${ref}"; then
                ok=1
                break
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "::error::phpdup source zip not downloadable for ref '${PHPDUP_VERSION}' (tried refs/tags, refs/heads and the raw ref on codeload). Pin a tag/branch/SHA that exists."
              exit 1
            fi
            unzip -q "$TOOL_HOME/tool.zip" -d "$TOOL_HOME/src"
            SRC_DIR=$(find "$TOOL_HOME/src" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -z "$SRC_DIR" ] || [ ! -f "$SRC_DIR/composer.json" ]; then
              echo "::error::phpdup source zip extracted without a composer.json at its root — refusing to continue."
              exit 1
            fi
            composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist --working-dir "$SRC_DIR"
            TOOL_BIN="$SRC_DIR/bin/phpdup"
            ;;
          phar)
            PHAR_URL_BASE="https://github.com/detain/php-dup-finder/releases/download/${PHPDUP_VERSION}"
            if ! curl -fsSL --retry 3 -o "$TOOL_HOME/phpdup.phar" "${PHAR_URL_BASE}/phpdup.phar"; then
              echo "::error::phpdup.phar asset for '${PHPDUP_VERSION}' is not downloadable (${PHAR_URL_BASE}/phpdup.phar). Release assets only exist once a v* tag has run through the release workflow — see docs/RELEASE.md 'Current publication status'; until then use tool: zip."
              exit 1
            fi
            # GNU coreutils-format sidecar "<hash>  phpdup.phar" (two spaces)
            # per once-S12; if it ships, verify it before running.
            if curl -fsSL --retry 3 -o "$TOOL_HOME/phpdup.phar.sha256" "${PHAR_URL_BASE}/phpdup.phar.sha256"; then
              (cd "$TOOL_HOME" && sha256sum --check phpdup.phar.sha256)
            else
              echo "No phpdup.phar.sha256 sidecar for '${PHPDUP_VERSION}'; proceeding without integrity check."
            fi
            TOOL_BIN="$TOOL_HOME/phpdup.phar"
            ;;
          *)
            echo "::error::Unknown tool mode '${PHPDUP_MODE}' (expected 'zip' or 'phar')."
            exit 1
            ;;
        esac

        if [ ! -f "$TOOL_BIN" ]; then
          echo "::error::phpdup was not materialized at '$TOOL_BIN' — failing instead of silently skipping the scan."
          exit 1
        fi
        # Smoke: `php <tool>` works for both the source bin and the phar
        # without depending on shebang/exec bits.
        php "$TOOL_BIN" --version
        echo "bin=$TOOL_BIN" >> "$GITHUB_OUTPUT"

    - name: Run phpdup
      id: run
      shell: bash
      env:
        PHPDUP_BIN: ${{ steps.tool.outputs.bin }}
        PHPDUP_PATHS: ${{ inputs.paths }}
        PHPDUP_MIN_IMPACT: ${{ inputs.min-impact }}
        PHPDUP_WORKERS: ${{ inputs.workers }}
        PHPDUP_CONFIG: ${{ inputs.config }}
        PHPDUP_EXACT_ONLY: ${{ inputs.exact-only }}
      run: |
        # Explicit flags — this step must behave identically on a GitHub
        # runner (`bash --noprofile --norc -eo pipefail`) and anywhere else
        # (once-S14 fix1, r1 report-row R2).
        set -euo pipefail
        if [ -z "$PHPDUP_BIN" ] || [ ! -f "$PHPDUP_BIN" ]; then
          echo "::error::Materialization produced no tool at '$PHPDUP_BIN' — refusing to skip the scan silently."
          exit 1
        fi
        ARGS=()
        for p in $PHPDUP_PATHS; do ARGS+=("$p"); done
        ARGS+=(--min-impact "$PHPDUP_MIN_IMPACT")
        ARGS+=(--workers "$PHPDUP_WORKERS")
        ARGS+=(--json phpdup-report.json)
        ARGS+=(--sarif phpdup-report.sarif)
        ARGS+=(--html phpdup-report)
        ARGS+=(--checkstyle phpdup-checkstyle.xml)
        ARGS+=(--csv phpdup-report.csv)
        ARGS+=(--prometheus phpdup-metrics.prom)
        ARGS+=(--timeseries phpdup-history.jsonl)
        if [ -n "$PHPDUP_CONFIG" ]; then ARGS+=(--config "$PHPDUP_CONFIG"); fi
        if [ "$PHPDUP_EXACT_ONLY" = "true" ]; then ARGS+=(--exact-only); fi

        # The analyze pipeline sits in an if-condition head ON PURPOSE: the
        # GitHub runner executes `shell: bash` as `bash --noprofile --norc -eo
        # pipefail {0}`, and under -e a bare failing pipeline would abort the
        # step AT the pipe — leaving the PIPESTATUS capture + mapping below
        # dead code (once-S14 r1 MEDIUM-1). errexit is suspended for an
        # if-condition pipeline, pipefail still reports phpdup's status, and
        # PIPESTATUS[0] survives into the else branch.
        if php "$PHPDUP_BIN" analyze "${ARGS[@]}" --plain | tee phpdup-stdout.txt; then
          RC=0
        else
          RC=${PIPESTATUS[0]}
          # Map phpdup's documented exit codes (docs/CLI.md) into the job log,
          # then propagate the ORIGINAL code — the job fails with phpdup's
          # verdict (1 runtime/unknown option, 2 invalid config, 3 gate tripped,
          # 4 baseline drift), not a laundered 1.
          case "$RC" in
            1) MEANING="runtime error or unknown option" ;;
            2) MEANING="invalid configuration" ;;
            3) MEANING="phpdup CI gate tripped (--fail-on-impact/--max-clusters)" ;;
            4) MEANING="baseline comparison found new clusters" ;;
            *) MEANING="unexpected exit status" ;;
          esac
          echo "::error::phpdup analyze exited $RC ($MEANING)."
          exit "$RC"
        fi
        echo "json=phpdup-report.json"   >> "$GITHUB_OUTPUT"
        echo "sarif=phpdup-report.sarif" >> "$GITHUB_OUTPUT"
        echo "html=phpdup-report"        >> "$GITHUB_OUTPUT"
        # Cluster count via the PHP that was just installed — no external jq
        # dependency (the old step set the output only 'if command -v jq',
        # silently leaving it empty elsewhere).
        CLUSTERS=$(php -r '$j = json_decode((string) @file_get_contents("phpdup-report.json"), true); echo is_array($j) && isset($j["summary"]["clusters"]) ? $j["summary"]["clusters"] : "";')
        echo "clusters=${CLUSTERS}" >> "$GITHUB_OUTPUT"

    - name: Upload reports as workflow artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: phpdup-reports
        path: |
          phpdup-report.json
          phpdup-report.sarif
          phpdup-report/
          phpdup-checkstyle.xml
          phpdup-report.csv
          phpdup-metrics.prom
          phpdup-history.jsonl

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: phpdup-report.sarif
        category: phpdup
      continue-on-error: true

    - name: Enforce impact threshold
      if: ${{ inputs.fail-on-impact != '0' }}
      shell: bash
      env:
        PHPDUP_FAIL_ON_IMPACT: ${{ inputs.fail-on-impact }}
      run: |
        # once-S15 (php-dup-finder-once-018): one canonical --fail-on-impact
        # semantic on BOTH surfaces — the largest single cluster impact
        # compared with `>=` the threshold, tripping with exit 3. This step
        # mirrors the CLI gate exactly (same formula, same gate-trip code);
        # it stays JSON-based so a tool ref predating the native CLI flag
        # still gates. A missing OR unparseable report while gating is ON
        # fails loudly with exit 1 (runtime posture) — never the historical
        # `&&`-chain exit 0 that silently passed any backlog without jq.
        set -euo pipefail
        if [ ! -f phpdup-report.json ]; then
          echo "::error::fail-on-impact is enabled but phpdup-report.json is missing — cannot gate; failing instead of skipping."
          exit 1
        fi
        php -r '
          $rawThreshold = (string) getenv("PHPDUP_FAIL_ON_IMPACT");
          if (!is_numeric($rawThreshold) || (int) $rawThreshold <= 0) {
              fwrite(STDERR, "::error::fail-on-impact: expected a positive integer threshold, got \x27{$rawThreshold}\x27 — refusing to gate (or pass) on a garbled value.\n");
              exit(1);
          }
          $threshold = (int) $rawThreshold;
          $raw = @file_get_contents("phpdup-report.json");
          $report = null;
          if ($raw !== false) {
              try {
                  $report = json_decode($raw, true, 512, JSON_THROW_ON_ERROR);
              } catch (JsonException) {
                  $report = null;
              }
          }
          if (!is_array($report) || !isset($report["clusters"]) || !is_array($report["clusters"])) {
              fwrite(STDERR, "::error::fail-on-impact: phpdup-report.json is not a readable phpdup JSON report (no clusters array) — cannot gate; failing (exit 1) instead of passing silently.\n");
              exit(1);
          }
          $max = 0;
          foreach ($report["clusters"] as $cluster) {
              $impact = (int) ((is_array($cluster) ? $cluster["impact"] : null) ?? 0);
              if ($impact > $max) { $max = $impact; }
          }
          echo "phpdup fail-on-impact gate: max cluster impact {$max}, threshold {$threshold} (trip at >=, exit 3).\n";
          if ($max >= $threshold) {
              fwrite(STDERR, "::error::fail-on-impact gate tripped: max cluster impact {$max} >= {$threshold}.\n");
              exit(3);
          }
        '
